services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: basufka-web
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./src:/app:Z
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  db:
    image: postgres:17
    container_name: basufka-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-basufka}
      POSTGRES_USER: ${POSTGRES_USER:-basufka}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-development-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-basufka} -d ${POSTGRES_DB:-basufka}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: basufka-redis
    restart: unless-stopped

volumes:
  postgres_data:
